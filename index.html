<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Socials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="socials.css" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <div class="parent-container">
      <div class="main">
        <img class="profile-pic" src="assets/avatar-jessica.jpeg" alt="profile picture of jessica"/>
        <h3 class="person-name">Harshita Gupta</h3>
        <h4 class="current-location">Chandigarh, India</h4>
        <p class="description">
          "Frontend Developer with 3 years of experience in Javascript , React.js & Typescript."
        </p>
        <!-- loop through the socials here to display in UI-->
        <ul id="listOfSocials"></ul>
      </div>
    </div>
  </body>
</html>
